[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "edge-agent"
version = "0.1.0"
description = "Stateless document parse server for the AI Archive Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "AI Archive Platform"}]
keywords = ["document-processing", "ocr", "archive", "parse-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13.0",
]

[project.scripts]
edge-agent = "edge_agent.cli:main"

[project.optional-dependencies]
full = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "pymupdf>=1.24",
]
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
]
mineru = [
    "mineru>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ai-archive-platform/edge-agent"

[tool.setuptools.packages.find]
include = ["edge_agent*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
